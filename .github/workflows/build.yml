name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p ~/.android
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set!"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
          echo "Configured keystore SHA-256:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare artifacts and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/miruroll-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/miruroll-debug.apk
          cd dist
          sha256sum miruroll-release.apk miruroll-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK signing certificate
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          CERT_SHA256=$($BUILD_TOOLS_DIR/apksigner verify --print-certs dist/miruroll-release.apk | grep -i "SHA-256" | head -n 1 | awk '{print tolower($NF)}')
          echo "Verified release APK certificate: $CERT_SHA256"
          if [ "$CERT_SHA256" != "95bce9ba684084f3c2c2465ab3a8196738738ccfd23ba8951496482a120e62ea" ]; then
            echo "::error::Release APK signing certificate does not match expected repository fingerprint!"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miruroll-apks
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/miruroll-release.apk
            dist/miruroll-debug.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true

  sync-extension-repo:
    name: Sync to Extension Repository
    needs: build
    if: github.repository == 'kartik-commits/MiruRoll' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MiruRoll
        uses: actions/checkout@v4
        with:
          path: miruroll

      - name: Check for repository sync token
        id: check_token
        env:
          EXTENSION_REPO_TOKEN: ${{ secrets.EXTENSION_REPO_TOKEN }}
        run: |
          if [ -n "$EXTENSION_REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "EXTENSION_REPO_TOKEN secret not set. Skipping sync to miru-extension repository."
          fi

      - name: Checkout miru-extension
        if: steps.check_token.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: kartik-commits/miru-extension
          token: ${{ secrets.EXTENSION_REPO_TOKEN }}
          path: miru-extension

      - name: Download release APK
        if: steps.check_token.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: miruroll-apks
          path: dist

      - name: Update extension repository files
        if: steps.check_token.outputs.enabled == 'true'
        run: |
          cp dist/miruroll-release.apk miru-extension/apk/miruroll.apk

          python3 - << 'EOF'
          import json, re

          with open("miruroll/app/build.gradle.kts", "r") as f:
              gradle_text = f.read()

          vcode_match = re.search(r'versionCode\s*=\s*(\d+)', gradle_text)
          vname_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)
          version_code = int(vcode_match.group(1)) if vcode_match else 1
          version_name = vname_match.group(1) if vname_match else "18.0.1"

          for filename in ["index.json", "index.min.json"]:
              path = f"miru-extension/{filename}"
              with open(path, "r") as f:
                  data = json.load(f)
              for entry in data:
                  if entry.get("pkg") == "dev.kartiks.animiru.miruroll" or entry.get("name") == "MiruRoll":
                      entry["code"] = version_code
                      entry["version"] = version_name
              indent = 2 if filename == "index.json" else None
              separators = (',', ': ') if filename == "index.json" else (',', ':')
              with open(path, "w") as f:
                  json.dump(data, f, indent=indent, separators=separators)
                  if indent:
                      f.write("\n")
          EOF

      - name: Commit and push updates to miru-extension
        if: steps.check_token.outputs.enabled == 'true'
        run: |
          cd miru-extension
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "kartik-commits"
            git config user.email "lashkare@duck.com"
            git add apk/miruroll.apk index.json index.min.json
            git commit -m "update MiruRoll APK from actions"
            git push origin main
          else
            echo "No changes detected in miru-extension repository."
          fi
