name: Bug Report
description: Report an issue or unexpected behavior in MiruRoll
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Open anime '...'
        2. Select episode '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead.
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      description: MiruRoll version (e.g. 18.0.1). Found in Browse > Extensions.
      placeholder: 18.0.1
    validations:
      required: true

  - type: input
    id: animiru-version
    attributes:
      label: Animiru Version
      description: Animiru app version (e.g. 0.20.1.2). Found in More > About.
      placeholder: 0.20.1.2
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device and Android Version
      description: Device model and Android version (e.g. Pixel 7, Android 14).
      placeholder: Device model, Android version
    validations:
      required: true

  - type: dropdown
    id: account-type
    attributes:
      label: Account Type
      description: Type of Crunchyroll session used.
      options:
        - Guest / Not logged in
        - Free Account
        - Mega Fan / Fan (Premium)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Crash logs or logcat output, if available.
      placeholder: Paste logs here or attach a text file.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have verified that this issue has not already been reported.
          required: true
        - label: I have updated both MiruRoll and Animiru to their latest releases.
          required: true
